services:
  bitcoind:
    image: bitcoin/bitcoin:30-alpine
    environment:
      BITCOIN_DATA: /opt/bitcoind-data/
    ports:
      - "127.0.0.1:18443:18443"
      - "127.0.0.1:18444:18444"
    # -fallbackfee: regtest has no fee-estimation history, so wallet sends fail
    # with "Fee estimation failed" unless a fallback rate is provided.
    command:
      -regtest
      -txindex
      -server
      -rpcuser=dev
      -rpcpassword=dev
      -rpcbind=0.0.0.0
      -rpcallowip=0.0.0.0/0
      -fallbackfee=0.0001

  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.10.9
    environment:
      BTCHOST: "bitcoind"
      BTCRPCPORT: "18443"
      BTCP2PPORT: "18444"
      BTCUSER: "dev"
      BTCPASS: "dev"
    ports:
      - "127.0.0.1:50001:50001"
    restart: always
    depends_on:
      - bitcoind

  # Official RGB proxy — the image rgb-lib's own test suite runs against, so it
  # is guaranteed to speak the proxy protocol version rgb-lib requires.
  rgb_proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
