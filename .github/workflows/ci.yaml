name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    env:
      BFA_MIRRORS_TOKEN: ${{ secrets.BFA_MIRRORS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Git dependency access
        run: |
          test -n "$BFA_MIRRORS_TOKEN" || { echo "BFA_MIRRORS_TOKEN needs read access to the RGB Git mirrors" >&2; exit 1; }
          echo "GIT_ASKPASS=$GITHUB_WORKSPACE/.github/scripts/git-askpass.sh" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
      - name: Configure git for cargo git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check-and-test:
    name: cargo check + test
    runs-on: ubuntu-latest
    env:
      BFA_MIRRORS_TOKEN: ${{ secrets.BFA_MIRRORS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Git dependency access
        run: |
          test -n "$BFA_MIRRORS_TOKEN" || { echo "BFA_MIRRORS_TOKEN needs read access to the RGB Git mirrors" >&2; exit 1; }
          echo "GIT_ASKPASS=$GITHUB_WORKSPACE/.github/scripts/git-askpass.sh" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Configure git for cargo git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: cargo check
        run: cargo check --locked --workspace --all-targets
      - name: cargo test
        run: cargo test --locked --workspace --all-targets

  docker:
    name: build + push image
    needs: [lint, check-and-test]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so build.rs resolves a real commit/branch, not a shallow sha.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` for branch builds; `:vX.Y.Z` + `:vX.Y` + `:latest` for tags;
      # always the short sha for traceability.
      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/utexo-protocol/rgb-node-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            bfa_mirrors_token=${{ secrets.BFA_MIRRORS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
