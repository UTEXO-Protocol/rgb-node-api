name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
      # Cargo pulls git dependencies directly from GitHub. Route both HTTPS and
      # SSH-style URLs through token-authenticated HTTPS so private forks can be
      # fetched non-interactively on CI runners. Prefer ORG_REPO_READ_TOKEN
      # when configured; otherwise fall back to the default workflow token.
      - name: Configure git for cargo git deps
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.ORG_REPO_READ_TOKEN != '' && secrets.ORG_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${GITHUB_AUTH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  check-and-test:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Configure git for cargo git deps
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.ORG_REPO_READ_TOKEN != '' && secrets.ORG_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${GITHUB_AUTH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo test (server-signing)
        run: cargo test --all-targets --features server-signing
      - name: Test Docker Git credentials
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  docker:
    name: build + push image (${{ matrix.variant }})
    needs: [lint, check-and-test]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Read-only build: the default image, tags unchanged.
          - variant: readonly
            features: ""
            suffix: ""
          # Full-wallet build (the node keeps keys and signs): same image name,
          # tags end in `-full`. Private deployments only.
          - variant: full
            features: server-signing
            suffix: "-full"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so build.rs resolves a real commit/branch, not a shallow sha.
          fetch-depth: 0

      - name: Check private dependency token
        env:
          ORG_REPO_READ_TOKEN: ${{ secrets.ORG_REPO_READ_TOKEN }}
        run: |
          if [ -z "$ORG_REPO_READ_TOKEN" ]; then
            echo "::error::Set ORG_REPO_READ_TOKEN with Contents read access to UTEXO-Protocol/rgb-lib-bfa."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` for branch builds; `:vX.Y.Z` + `:vX.Y` + `:latest` for tags;
      # always the short sha for traceability. The full-wallet variant adds
      # `-full` to every tag (`:main-full`, `:1.2.3-full`, `:latest-full`).
      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/utexo-protocol/rgb-node-api
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FEATURES=${{ matrix.features }}
          secrets: |
            github_token=${{ secrets.ORG_REPO_READ_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per variant, so the two builds do not overwrite each other.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
