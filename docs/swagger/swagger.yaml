openapi: 3.1.0
info:
  title: RGB Wallet API
  description: API documentation for RGB wallet management and asset transfers
  version: 1.0.0
paths:
  /healthcheck:
    get:
      summary: Healthcheck
      description: Service liveness check. Returns an empty body.
      operationId: healthcheck_healthcheck_get
      responses:
        '200':
          description: Successful Response
  /version:
    get:
      summary: Version
      description: Build and version information for the running service.
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfo'
  /wallet/register:
    post:
      summary: Register Wallet
      operationId: register_wallet_wallet_register_post
      parameters:
        - name: xpub-van
          in: header
          required: true
          schema:
            type: string
            title: Xpub Van
        - name: xpub-col
          in: header
          required: true
          schema:
            type: string
            title: Xpub Col
        - name: master-fingerprint
          in: header
          required: true
          schema:
            type: string
            title: Master Fingerprint
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
