          description: Confirmations the incoming transfer must reach to settle.
          default: 1
        asset_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Asset Id
          description: >-
            Bind the invoice to one asset. The asset must already be known to
            this wallet, otherwise the request fails with 404 `not_found`. Omit
            it (or send `null`) to accept any asset — the only option for an
            asset the wallet has never held.
        amount:
          anyOf:
            - type: integer
            - type: 'null'
          title: Amount
          description: >-
            Amount to request, in the asset's smallest unit. Omit it, or send
            `0`, to accept any amount.
