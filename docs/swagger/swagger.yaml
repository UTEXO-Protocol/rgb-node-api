components:
  schemas:
    AppInfo:
      properties:
        app:
          type: string
          title: App
        version:
          type: string
          title: Version
        build:
          type: string
          title: Build
        commit:
          type: string
          title: Commit
      type: object
      required:
        - app
        - version
        - build
        - commit
      title: AppInfo
    AssetBalanceRequest:
      properties:
        asset_id:
          type: string
          title: Asset Id
      type: object
      required:
        - asset_id
      title: AssetBalanceRequest
      description: >-
        The legacy camelCase spelling `assetId` is still accepted for backwards
        compatibility, but is undocumented and will be removed.
    AssetCfa:
      properties:
        asset_id:
          type: string
          title: Asset Id
        name:
          type: string
          title: Name
        details:
          anyOf:
            - type: string
            - type: 'null'
          title: Details
        precision:
          type: integer
          title: Precision
        issued_supply:
          type: integer
          title: Issued Supply
        timestamp:
          type: integer
          title: Timestamp
        added_at:
          type: integer
          title: Added At
        balance:
          $ref: '#/components/schemas/Balance'
        media:
          anyOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
      type: object
      required:
        - asset_id
        - name
        - details
        - precision
        - issued_supply
        - timestamp
        - added_at
        - balance
        - media
      title: AssetCfa
    AssetIfa:
      properties:
        asset_id:
          type: string
          title: Asset Id
        ticker:
          type: string
          title: Ticker
        name:
          type: string
          title: Name
        details:
          anyOf:
            - type: string
            - type: 'null'
          title: Details
        precision:
          type: integer
          title: Precision
        initial_supply:
          type: integer
          title: Initial Supply
        max_supply:
          type: integer
          title: Max Supply
        known_circulating_supply:
          type: integer
          title: Known Circulating Supply
        timestamp:
          type: integer
          title: Timestamp
        added_at:
          type: integer
          title: Added At
        balance:
          $ref: '#/components/schemas/Balance'
        media:
          anyOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
        reject_list_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Reject List Url
      type: object
      required:
        - asset_id
        - ticker
        - name
        - details
        - precision
        - initial_supply
        - max_supply
        - known_circulating_supply
        - timestamp
        - added_at
        - balance
        - media
        - reject_list_url
      title: AssetIfa
    AssetNia:
      properties:
        asset_id:
          type: string
          title: Asset Id
        ticker:
          type: string
          title: Ticker
        name:
          type: string
          title: Name
        details:
          anyOf:
            - type: string
            - type: 'null'
          title: Details
        precision:
          type: integer
          title: Precision
        issued_supply:
          type: integer
          title: Issued Supply
        timestamp:
          type: integer
          title: Timestamp
        added_at:
          type: integer
          title: Added At
        balance:
          $ref: '#/components/schemas/Balance'
        media:
          anyOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
      type: object
      required:
        - asset_id
        - ticker
        - name
        - details
        - precision
        - issued_supply
        - timestamp
        - added_at
        - balance
        - media
      title: AssetNia
    AssetUda:
      properties:
        asset_id:
          type: string
          title: Asset Id
        ticker:
          type: string
          title: Ticker
        name:
          type: string
          title: Name
        details:
          anyOf:
            - type: string
            - type: 'null'
          title: Details
        precision:
          type: integer
          title: Precision
        timestamp:
          type: integer
          title: Timestamp
        added_at:
          type: integer
          title: Added At
        balance:
          $ref: '#/components/schemas/Balance'
        media:
          anyOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
        token:
          anyOf:
            - $ref: '#/components/schemas/TokenLight'
            - type: 'null'
      type: object
      required:
        - asset_id
        - ticker
        - name
        - details
        - precision
        - timestamp
        - added_at
        - balance
        - media
        - token
      title: AssetUda
    Assets:
      properties:
        nia:
          anyOf:
            - items:
                $ref: '#/components/schemas/AssetNia'
              type: array
            - type: 'null'
          title: Nia
        uda:
          anyOf:
            - items:
                $ref: '#/components/schemas/AssetUda'
              type: array
            - type: 'null'
          title: Uda
        cfa:
          anyOf:
            - items:
                $ref: '#/components/schemas/AssetCfa'
              type: array
            - type: 'null'
          title: Cfa
        ifa:
          anyOf:
            - items:
                $ref: '#/components/schemas/AssetIfa'
              type: array
            - type: 'null'
          title: Ifa
      type: object
      required:
        - nia
        - uda
        - cfa
        - ifa
      title: Assets
      description: Assets owned by the wallet, grouped by schema.
    Assignment:
      anyOf:
        - type: string
          enum:
            - NonFungible
            - LinkRight
            - Any
        - type: object
          properties:
            Fungible:
              type: integer
          required:
            - Fungible
          additionalProperties: false
        - type: object
          properties:
            InflationRight:
              type: integer
          required:
            - InflationRight
          additionalProperties: false
      title: Assignment
      description: >-
        An RGB assignment, serialized as an externally tagged enum: unit
        variants are plain strings ("NonFungible", "LinkRight", "Any"),
        data-carrying variants are single-key objects (e.g. {"Fungible": 100}).
    Balance:
      properties:
        settled:
          type: integer
          title: Settled
        future:
          type: integer
          title: Future
        spendable:
          type: integer
          title: Spendable
      type: object
      required:
        - settled
        - future
        - spendable
      title: Balance
    BlockTime:
      properties:
        height:
          type: integer
          title: Height
        timestamp:
          type: integer
          title: Timestamp
      type: object
      required:
        - height
        - timestamp
      title: BlockTime
      description: Height and Unix timestamp of the confirming block.
    BtcBalance:
      properties:
        vanilla:
          $ref: '#/components/schemas/Balance'
        colored:
          $ref: '#/components/schemas/Balance'
      type: object
      required:
        - vanilla
        - colored
      title: BtcBalance
    CreateUtxosBegin:
      properties:
        up_to:
          type: boolean
          title: Up To
          default: false
        num:
          type: integer
          title: Num
          default: 5
        size:
          type: integer
          title: Size
          default: 1000
        fee_rate:
          type: integer
          title: Fee Rate
          default: 1
      type: object
      title: CreateUtxosBegin
      description: >-
        The legacy camelCase spellings `upTo` and `feeRate` are still accepted
        for backwards compatibility, but are undocumented and will be removed.
    CreateUtxosEnd:
      properties:
        signed_psbt:
          type: string
          title: Signed Psbt
      type: object
