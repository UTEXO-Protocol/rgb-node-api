components:
  responses:
    BadRequest:
      description: |-
        The request data is invalid. `error.code` is one of: 1001
        `bad_input`, 1002 `invalid_address`, 1003 `not_enough_balance`,
        1004 `not_enough_utxos`, 1005 `not_enough_assets`, 1006
        `invalid_fee_rate`, 1007 `invalid_psbt`, 1008 `invalid_recipient`,
        1010 `unsupported`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >-
        A required wallet key header (`xpub-van`, `xpub-col`,
        `master-fingerprint`) is missing. `error.code` is 401 `access_denied`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: >-
        The referenced asset, transfer or batch transfer does not exist.
        `error.code` is 1000 `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >-
        The request conflicts with the current wallet state, e.g. the recipient
        ID was already used or the allocations are already available.
        `error.code` is 1009 `conflict`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: >-
        The request body is not valid JSON or does not match the expected
        schema. `error.code` is 1001 `bad_input` and `error.details.body`
        holds the parser message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: >-
        Something failed on the server side. The message is intentionally
        opaque; `error.code` is 500 `internal_error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        A dependency the wallet needs (indexer, RGB proxy, network) is
        unreachable. The request can be retried. `error.code` is 503
        `service_unavailable`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AddressResponse:
      properties:
        address:
          type: string
          title: Address
          examples:
            - bcrt1qk0k2xn9y8dxsgkqfp0mrqx5cgqm2lqxhnzq3lc
      type: object
      required:
        - address
      title: AddressResponse
    ApiError:
      properties:
        code:
          type: integer
          title: Code
          description: |-
            Machine-readable error code, stable across releases:

            | code | status | meaning |
            | ---- | ------ | ------- |
            | 500 | `internal_error` | server-side failure |
            | 503 | `service_unavailable` | indexer / proxy / network unreachable |
            | 401 | `access_denied` | missing or invalid wallet key headers |
            | 403 | `access_forbidden` | the key is blocked or suspended |
            | 1000 | `not_found` | the referenced entity does not exist |
            | 1001 | `bad_input` | invalid request data |
            | 1002 | `invalid_address` | invalid bitcoin address |
            | 1003 | `not_enough_balance` | not enough bitcoins to fund the operation |
            | 1004 | `not_enough_utxos` | create more UTXOs first |
            | 1005 | `not_enough_assets` | not enough assets for the requested amount |
            | 1006 | `invalid_fee_rate` | fee rate outside the accepted range |
            | 1007 | `invalid_psbt` | the PSBT is malformed or cannot be finalized |
            | 1008 | `invalid_recipient` | invalid recipient, invoice or transport endpoint |
            | 1009 | `conflict` | the request clashes with the current wallet state |
            | 1010 | `unsupported` | the wallet cannot perform this operation |
          examples:
            - 1006
        status:
          type: string
          title: Status
          description: Short slug for `code`, e.g. `invalid_fee_rate`.
          examples:
            - invalid_fee_rate
        message:
          type: string
          title: Message
