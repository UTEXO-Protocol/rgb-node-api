[package]
edition = "2024"
name = "rgb-node-api"
version = "0.2.0"
default-run = "rgb-node-api"

[workspace]
members = ["wallet-cli"]
resolver = "3"

# rgb-lib is shared so the server and the signing CLI can never resolve to
# different revisions — the wallet descriptors they derive must match exactly
# or client-side signatures will not validate server-side.
[workspace.dependencies]
rgb-lib = { git = "ssh://git@github.com/UTEXO-Protocol/rgb-lib.git", tag = "v0.3.0-beta.43-bfa", default-features = false, features = ["electrum", "esplora"] }

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.0"
actix-files = "0.6.10"
actix-web = "4.5.1"
actix-web-prom = { version = "0.9.0", features = ["process"] }
anyhow = "1.0.81"
bigdecimal = { version = "0.4.5", features = ["serde", "serde-json"] }
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
hex = "0.4.3"
log = { version = "0.4.21", features = ["kv", "std", "serde", "kv_serde"] }
mime_guess = "2.0.4"
num_enum = "0.7.3"
prometheus = { version = "0.13.4", features = ["process"] }
rgb-lib.workspace = true
rust-embed = { version = "8.3.0", features = [
  "actix",
  "actix-web",
  "mime-guess",
] }
sentry-actix = "0.34.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_valid = { version = "1.0.5", features = ["toml"] }
tokio = { version = "1.43.0", default-features = false, features = ["full"] }
tokio-util = { version = "0.7.10", default-features = false, features = [
  "full",
] }
toml = "0.9.6"

[dev-dependencies]
# pins the wire format of the response models in tests
serde_json = "1.0"

# The BFA tags of rgb-lib build against BFA forks of the RGB crates through
# [patch.crates-io], which Cargo does not propagate to dependents. Keep these
# revisions in sync with the pinned rgb-lib tag.
[patch.crates-io]
rgb-consensus = { git = "https://github.com/UTEXO-Protocol/rgb-consensus-s-bfa", rev = "2faf6118b2f5fe30dd90dd5244d5a7dc32bcd757" }
rgb-ops = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa", rev = "773766b5ca7a9e705ec68c2f9ed0917f505cd6e3" }
rgb-invoicing = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa", rev = "773766b5ca7a9e705ec68c2f9ed0917f505cd6e3" }
rgb-schemas = { git = "https://github.com/UTEXO-Protocol/rgb-schemas-s-bfa", rev = "238dfe7a89db998107fd87d919bf2757a2746d7f" }
