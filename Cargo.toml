[package]
edition = "2024"
name = "rgb-node-api"
version = "0.2.0"
default-run = "rgb-node-api"

[workspace]
members = ["wallet-cli", "esplora-adapter"]
resolver = "3"

# rgb-lib is shared so the server and the signing CLI can never resolve to
# different revisions — the wallet descriptors they derive must match exactly
# or client-side signatures will not validate server-side.
[workspace.dependencies]
rgb-lib = { git = "https://github.com/UTEXO-Protocol/rgb-lib-bfa", tag = "v0.3.0-beta.7-upstream-dev-bfa.8", default-features = false, features = ["electrum", "esplora"] }

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.0"
actix-files = "0.6.10"
actix-web = "4.5.1"
actix-web-prom = { version = "0.9.0", features = ["process"] }
anyhow = "1.0.81"
bigdecimal = { version = "0.4.5", features = ["serde", "serde-json"] }
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
hex = "0.4.3"
log = { version = "0.4.21", features = ["kv", "std", "serde", "kv_serde"] }
mime_guess = "2.0.4"
num_enum = "0.7.3"
prometheus = { version = "0.13.4", features = ["process"] }
rgb-lib.workspace = true
rust-embed = { version = "8.3.0", features = [
  "actix",
  "actix-web",
  "mime-guess",
] }
sentry-actix = "0.34.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_valid = { version = "1.0.5", features = ["toml"] }
tokio = { version = "1.43.0", default-features = false, features = ["full"] }
tokio-util = { version = "0.7.10", default-features = false, features = [
  "full",
] }
toml = "0.9.6"

[dev-dependencies]
# pins the wire format of the response models in tests
serde_json = "1.0"

[patch.crates-io]
rgb-aluvm = { git = "https://github.com/rgb-protocol/rgb-aluvm", rev = "eb956ccaadf64930990e2ed08f6c4232caee24f9" }
rgb-ascii-armor = { git = "https://github.com/rgb-protocol/rgb-ascii-armor", rev = "40cdea632fd6d0527494893e83b99cea60ace310" }
rgb-consensus = { git = "https://github.com/rgb-protocol/rgb-consensus", rev = "d4bbbce212e4d9967e10cc3c6a7db2f664d52bd2" }
rgb-ops = { git = "https://github.com/rgb-protocol/rgb-ops", rev = "00f8d62e6107767cca085d9f9b3183c35ad6d71f" }
rgb-invoicing = { git = "https://github.com/rgb-protocol/rgb-ops", rev = "00f8d62e6107767cca085d9f9b3183c35ad6d71f" }
rgb-psbt-utils = { git = "https://github.com/rgb-protocol/rgb-api", rev = "4922e50734ab456d086546ab2befd5fa0aec99cc" }
rgb-schemas = { git = "https://github.com/rgb-protocol/rgb-schemas", rev = "b3f88f28c83aa8c73cf9ed2bb40ad6890142d675" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8714cdcc8af25333c27214cdf9f42a6388d484ff" }
